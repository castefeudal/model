name: Generate Open Graph image
on:
  push:
    paths:
      - tools/build_social.py
      - .github/workflows/social.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - run: python tools/build_social.py
      - name: Commit optimized social preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/social-cover.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add optimized social sharing preview image'
            git push origin HEAD:main
          fi
