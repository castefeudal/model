name: Build first-party CJK type subsets
on:
  push:
    branches: [main, feat/issue07-final-casting-book]
    paths:
      - tools/build_cjk_font.py
      - .github/workflows/cjk-font.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cjk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small-font subsetter
        run: python -m pip install --quiet fonttools brotli
      - name: Generate first-party Simplified Chinese type
        run: python tools/build_cjk_font.py
      - name: Commit first-party type assets and OFL licenses
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fonts/
          if ! git diff --cached --quiet; then
            git commit -m 'Add OFL-licensed optimized CJK type assets'
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
