name: Optimize authentic hero AVIF assets
on:
  push:
    branches: [main, 'feat/**']
    paths:
      - tools/build_hero_avif.py
      - .github/workflows/hero-avif.yml
      - assets/portrait-fashion.webp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optimized AVIF support
        run: python -m pip install --quiet 'Pillow>=12,<13'
      - name: Generate and verify photo delivery variants
        run: python tools/build_hero_avif.py
      - name: Publish only generated AVIF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portrait-fashion-1600.avif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Optimize verified archival hero photograph as responsive AVIF'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase FETCH_HEAD
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep "$attempt"
          done
          echo "Could not publish AVIF files safely" >&2
          exit 1
