name: Generate optimized portfolio thumbnails
on:
  push:
    branches: [main]
    paths:
      - tools/build_thumbnails.py
      - .github/workflows/thumbnails.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Generate and verify thumbnails
        run: python tools/build_thumbnails.py
      - name: Publish optimized images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/thumbs/
          if ! git diff --cached --quiet; then
            git commit -m 'Generate optimized casting gallery thumbnails'
            git push origin HEAD:main
          fi
